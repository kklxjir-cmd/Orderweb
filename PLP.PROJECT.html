<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLP PROJECT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 25px;
            background: linear-gradient(135deg, #2d0c5e 0%, #1a053a 50%, #0f0f1a 100%);
            color: #fff;
            line-height: 1.8;
        }
        .wadah {
            max-width: 720px;
            text-align: center;
        }
        .judul {
            font-size: 2.7rem;
            font-weight: 900;
            color: #facc15;
            margin-bottom: 40px;
            line-height: 1.3;
            min-height: 70px;
        }
        .kursor {
            display: inline-block;
            width: 4px;
            height: 2.8rem;
            background-color: #facc15;
            margin-left: 5px;
            animation: kedip 0.8s step-end infinite;
            vertical-align: middle;
        }
        .kursor-kecil {
            height: 1rem;
            background-color: #a78bfa;
        }
        @keyframes kedip {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .penjelasan {
            font-size: 1.25rem;
            color: #e0d7f5;
            line-height: 2;
            text-align: justify;
            text-align-last: center;
            padding: 0 10px;
            margin-bottom: 25px;
            min-height: 120px;
        }
        .info-tiktok {
            font-size: 0.9rem;
            color: #a78bfa;
            opacity: 0.85;
            min-height: 30px;
        }
        @media (max-width: 480px) {
            .judul { font-size: 1.9rem; }
            .kursor { height: 2rem; }
            .penjelasan { font-size: 1.05rem; line-height: 1.9; }
            .info-tiktok { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="wadah">
        <h1 class="judul" id="judulKetak"></h1>
        <p class="penjelasan" id="penjelasanKetak"></p>
        <p class="info-tiktok" id="tiktokKetak"></p>
    </div>

    <script>
        const teksJudul = "APA ITU PLP PROJECT?";
        const teksPenjelasan = "(Perental Kontrol) Alat orang tua untuk melindungi anak dan hal positif dan bijak lainnya, bukan alat mata-mata. Semua fitur ada izinnya, semua data dijaga keamanannya masing!";
        const teksTiktok = "Mau dapet aplikasi PLP PROJECT cari di tiktok";

        let i = 0;
        function ketikJudul() {
            if (i < teksJudul.length) {
                document.getElementById('judulKetak').innerHTML = teksJudul.substring(0, i + 1) + '<span class="kursor"></span>';
                i++;
                setTimeout(ketikJudul, 100);
            } else {
                document.getElementById('judulKetak').innerHTML = teksJudul;
                i = 0;
                setTimeout(ketikPenjelasan, 400);
            }
        }

        function ketikPenjelasan() {
            if (i < teksPenjelasan.length) {
                document.getElementById('penjelasanKetak').innerHTML = teksPenjelasan.substring(0, i + 1);
                i++;
                setTimeout(ketikPenjelasan, 25);
            } else {
                document.getElementById('penjelasanKetak').innerHTML = teksPenjelasan;
                i = 0;
                setTimeout(ketikTiktok, 400);
            }
        }

        function ketikTiktok() {
            if (i < teksTiktok.length) {
                document.getElementById('tiktokKetak').innerHTML = teksTiktok.substring(0, i + 1) + '<span class="kursor kursor-kecil"></span>';
                i++;
                setTimeout(ketikTiktok, 40);
            } else {
                document.getElementById('tiktokKetak').innerHTML = teksTiktok;
            }
        }

        ketikJudul();
    </script>
</body>
</html>
