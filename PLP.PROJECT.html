    <title>PLP PROJECT - Parental Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #050714 0%, #0f172a 25%, #1e293b 50%, #0f172a 75%, #050714 100%);
            background-size: 400% 400%;
            animation: latarBergerak 12s ease infinite;
        }

        @keyframes latarBergerak {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 150, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 255, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .cahaya {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }
        .cahaya-1 {
            width: 400px;
            height: 400px;
            background: #0066ff;
            top: -100px;
            left: -100px;
            animation: cahaya1 8s ease-in-out infinite alternate;
        }
        .cahaya-2 {
            width: 350px;
            height: 350px;
            background: #00ccff;
            bottom: -80px;
            right: -80px;
            animation: cahaya2 10s ease-in-out infinite alternate;
        }
        .cahaya-3 {
            width: 300px;
            height: 300px;
            background: #0044ff;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: cahaya3 15s ease-in-out infinite alternate;
        }

        @keyframes cahaya1 {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 40px); }
        }
        @keyframes cahaya2 {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-50px, -60px); }
        }
        @keyframes cahaya3 {
            0% { opacity: 0.15; }
            50% { opacity: 0.35; }
            100% { opacity: 0.15; }
        }

        .wadah {
            max-width: 580px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .teks-utama {
            font-size: 19px;
            line-height: 1.9;
            color: #e6f0ff;
            background: linear-gradient(135deg, rgba(10, 30, 60, 0.7), rgba(20, 50, 100, 0.5));
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid rgba(0, 180, 255, 0.3);
            box-shadow: 
                0 8px 40px rgba(0, 100, 255, 0.15),
                0 0 60px rgba(0, 150, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: 45px;
        }

        .teks-utama strong {
            color: #00eeff;
            text-shadow: 0 0 12px rgba(0, 238, 255, 0.5);
            font-weight: 700;
        }

        .tombol-unduh {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 42px;
            font-size: 21px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, #0066ff, #0099ff, #00ccff);
            background-size: 200% 200%;
            border-radius: 60px;
            box-shadow: 
                0 0 30px rgba(0, 102, 255, 0.4),
                0 8px 25px rgba(0, 80, 200, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.35s ease;
            letter-spacing: 1px;
            animation: tombolNyalakan 3s ease infinite alternate;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .tombol-unduh::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .tombol-unduh:hover::before {
            left: 100%;
        }

        @keyframes tombolNyalakan {
            0% { box-shadow: 0 0 30px rgba(0, 102, 255, 0.4), 0 8px 25px rgba(0, 80, 200, 0.3); }
            100% { box-shadow: 0 0 45px rgba(0, 102, 255, 0.6), 0 8px 30px rgba(0, 80, 200, 0.4); }
        }

        .tombol-unduh:hover {
            transform: translateY(-4px) scale(1.04);
            background-position: 100% 0;
        }

        .tombol-unduh:active {
            transform: translateY(0) scale(0.98);
        }

        /* âœ… TOMBOL SALURAN ADMIN - KECIL & BERWARNA HIJAU */

            background: linear-gradient(135deg, #25d366, #128c7e);
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.35);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .tombol-admin:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.5);
        }

        .tombol-admin:active {
            transform: translateY(0) scale(0.98);
        }

        .ikon-bawah {
            margin-top: 35px;
            color: rgba(160, 190, 255, 0.5);
            font-size: 15px;
            letter-spacing: 2px;
        }
    </style>
