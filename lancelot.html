<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALURAN ADMIN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .judul {
            font-size: 42px;
            font-weight: 800;
            color: #fff;
            text-align: center;
            margin-bottom: 60px;
            text-shadow: 0 0 20px rgba(138, 43, 226, 0.8),
                         0 0 40px rgba(138, 43, 226, 0.5);
            letter-spacing: 2px;
        }
        .wadah-tombol {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
        }
        .tombol {
            padding: 22px 30px;
            font-size: 20px;
            font-weight: 700;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #7928ca 0%, #4b0082 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(121, 40, 202, 0.4);
        }
        .tombol:hover {
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 8px 25px rgba(121, 40, 202, 0.6);
            background: linear-gradient(135deg, #9d4edd 0%, #7b2cbf 100%);
        }
        .tombol:nth-child(2) {
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }
        .tombol:nth-child(2):hover {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.6);
        }
        .amanah {
            font-size: 15px;
            color: #ffd60a;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 214, 10, 0.6);
        }
    </style>
</head>
<body>
    <h1 class="judul">SALURAN ADMIN</h1>
    
    <div class="wadah-tombol">
        <a href="#" class="tombol">saluran LanzXytre</a>
        <a href="#" class="tombol">saluran jasa jasgen isian ff</a>
    </div>

    <p class="amanah">1000% AMANAHH</p>
</body>
</html>
